<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Perbaikan template Excel</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { font-family:"Segoe UI",Arial,sans-serif; color:#fff; background:#17365d; }
    .wrap { height:100%; padding:110px 130px; display:flex; flex-direction:column; justify-content:center; }
    .label { color:#e4bd68; font-size:22px; letter-spacing:2px; text-transform:uppercase; }
    h1 { max-width:1350px; margin:28px 0 22px; font-size:76px; line-height:1.1; }
    p { max-width:1250px; margin:0; color:#dce7ee; font-size:30px; line-height:1.45; }
    .rule { width:150px; height:7px; margin:38px 0; background:#d6a84b; }
    .footer { position:absolute; left:130px; right:130px; bottom:75px; display:flex; justify-content:space-between; color:#becfda; font-size:22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">Contoh workbook</div>
    <h1>Perbaikan template Excel untuk tim teknis</h1>
    <div class="rule"></div>
    <p>Input teknisi, master data, rumus, laporan, dan pemeriksaan hasil</p>
    <div class="footer"><strong>Mahathir</strong><span>Data dalam contoh ini bersifat fiktif</span></div>
  </div>
</body>
</html>
